<h2>Espressoir giriş kodun</h2>

<p>Giriş sayfasında bu kodu yaz:</p>

<p style="font-family: ui-monospace, Menlo, monospace; font-size: 28px; letter-spacing: 6px">
  <strong>{{ .Token }}</strong>
</p>

<p>
  Ya da aynı işi bu bağlantı görür:
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Girişi tamamla</a>
</p>

<p>Kod ve bağlantı bir saat geçerlidir, yalnızca bir kez kullanılabilir.</p>

<p>Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin; hesabına kimse giremez.</p>
