name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format · Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test

  database:
    name: Migrations on a fresh Supabase Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docker runs here on GitHub's machine, never on a developer laptop.
      - name: Start local Supabase Postgres (applies all migrations from scratch)
        run: pnpm exec supabase db start
      - name: Every migration rolls back and re-applies
        run: scripts/verify-migrations.sh "$LOCAL_DB_URL"
      - name: Generated DB types match the migrations
        run: |
          pnpm types:gen --db-url "$LOCAL_DB_URL"
          git diff --exit-code -- packages/db/src/database.types.ts \
            || (echo "::error::database.types.ts is stale. Run 'pnpm types:gen' and commit it." && exit 1)
      # The same tests `pnpm check` runs on an in-process Postgres, now on the real thing.
      - name: RLS, RPC and import tests on Supabase Postgres
        run: pnpm --filter @espressoir/scripts test
        env:
          TEST_DB_URL: ${{ env.LOCAL_DB_URL }}
      - if: always()
        run: pnpm exec supabase stop --no-backup || true

  e2e:
    name: Build · E2E on a local Supabase (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER_USERNAME: owner
      OWNER_EMAIL: owner@example.test
      E2E_GUEST_EMAIL: guest@example.test
      NEXT_PUBLIC_SIGNUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @espressoir/web exec playwright install --with-deps chromium
      # Database, API and auth only; the migrations are applied from scratch.
      # Docker runs here on GitHub's machine, never on a developer laptop.
      - name: Start local Supabase
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor,mailpit
      - name: Export connection settings and one-off test passwords
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; source "$RUNNER_TEMP/supabase.env"; set +a
          owner_password="$(openssl rand -hex 16)"
          guest_password="$(openssl rand -hex 16)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$guest_password"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "OWNER_PASSWORD=$owner_password"
            echo "E2E_OWNER_EMAIL=$OWNER_EMAIL"
            echo "E2E_OWNER_PASSWORD=$owner_password"
            echo "E2E_GUEST_PASSWORD=$guest_password"
          } >> "$GITHUB_ENV"
      - name: Create the test accounts and load the sample archive
        run: |
          pnpm admin:bootstrap
          pnpm exec tsx scripts/e2e-setup.ts
          pnpm seed:dev
      - run: pnpm turbo run build --filter=@espressoir/web
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - if: always()
        run: pnpm exec supabase stop --no-backup || true
